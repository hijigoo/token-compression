# 짧은 산문(평균 150자)에 같은 기법을 겁니다.
# 숫자·식별자·부정어가 밀집해 있어 요약이 가장 위험한 입력입니다.
name: plain-short
lab: 03-summarize-llm

dataset:
  path: ../../data/sample

model: gpt-5.4

params:
  style: plain
  target_ratio: 0.5
  cache: true
  max_calls: 200
  max_output_tokens: 2048

tokenizer:
  mode: both            # both(기본) | api | local
                        #   both  — API 실측을 기준으로 쓰고 tiktoken 추정도 함께 잽니다
                        #   api   — 실측만. 자격증명이 없으면 실패합니다
                        #   local — tiktoken 만. 네트워크를 쓰지 않습니다
  cache: true           # 같은 텍스트는 한 번만 호출합니다
