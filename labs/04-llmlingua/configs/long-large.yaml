# LongLLMLingua 를 3배 큰 모델(1.5B)로 돌립니다.
#
# ⚠️ 실측 결과 **나아지지 않았습니다.** 0.5B 와 마찬가지로 숫자 중간이
#    잘립니다. use_sentence_level_filter 도 시험했지만 같았습니다.
#    토큰 단위로 버리는 방식 자체의 특성으로 보입니다.
#
# 그래도 남겨 둡니다. 직접 확인해 보실 수 있어야 하고, 7B(paper)에서는
# 다를 수도 있기 때문입니다.
name: long-large
lab: 04-llmlingua

dataset:
  path: ../../data/sample-bilingual

model: gpt-5.4

params:
  variant: long
  model_name: large         # small | large | paper | HuggingFace 경로
  rate: 0.5
  force_reserve_digit: true

tokenizer:
  mode: both
  cache: true
