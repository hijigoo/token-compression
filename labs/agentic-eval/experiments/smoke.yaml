# 질문: 파이프라인이 끝까지 도는가?
#
# 결과를 보려는 실험이 아닙니다. 프록시·pier·Docker·모델 호출이 이어지는지만
# 확인합니다. 그래서 태스크 1개, 시도 1회, arm 2개로 가장 작게 잡았습니다.
#
#   PUBLIC_HOST=benchmark-host python launch.py experiments/smoke.yaml
#
# 여기서 baseline 이 실패하면 압축 실험은 볼 것도 없습니다. 먼저 그것부터
# 통과시키세요.

name: smoke
benchmark: deep-swe
langs: [en, ko]
model: openai/gpt-5.5
agent: mini-swe-agent

dataset:
  # 뽑지 않고 직접 지정합니다. 113건 중 지시문이 가장 짧아(571자) 가장
  # 빨리 끝납니다. 파이프라인 확인이 목적이라 내용은 상관없습니다.
  tasks:
    - mashumaro-flattened-dataclass-fields

n_attempts: 1           # 확률성을 보려는 게 아니라 연결만 봅니다
n_concurrent_trials: 1  # 실패했을 때 로그를 읽기 쉽게

arms:
  - name: baseline
    kind: direct

  # 압축 경로도 한 번은 지나가 봐야 합니다. 프록시가 요청을 받아
  # 되돌려주는지까지 확인하려는 것이지, 압축률을 보려는 게 아닙니다.
  - name: llmlingua-r0.8
    kind: local
    compressor: llmlingua
    ratio: 0.8
