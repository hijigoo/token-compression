# 질문: 압축을 얼마나 세게 하면 정확도가 무너지기 시작하는가?
#
# 손익분기점을 찾는 실험. 곡선이 급격히 꺾이는 지점이 실전 운영 기준선이 된다.
#
#   PUBLIC_HOST=benchmark-host python launch.py experiments/ratio-sweep.yaml
#
# ⚠️ 먼저 n_tasks 를 작게(5) 두고 파이프라인부터 검증하세요.
#    arm 6개 × 태스크 20개 × 3회 = 360 trial 이고 각 최대 3시간입니다.

name: ratio-sweep
benchmark: deep-swe
langs: [en]           # 압축률 곡선만 보는 실험이라 한 언어로 충분합니다
model: openai/gpt-5.5
agent: mini-swe-agent

dataset:
  n_tasks: 5          # 파이프라인 검증 후 20 으로 올릴 것
  sample_seed: 0      # 모든 arm 이 같은 태스크를 받게 하는 유일한 장치

n_attempts: 3         # LLM 확률성 — 1회로는 압축 탓인지 운 탓인지 모른다
n_concurrent_trials: 4

arms:
  - name: baseline
    kind: direct

  # Headroom 은 이미 OpenAI 호환 프록시라 compressors/ 에 파일이 없다.
  # --no-cache / --no-ccr 는 launch.py 가 강제하므로 여기 쓰지 않는다.
  - name: headroom-r0.9
    kind: headroom
    args: [--mode, token, --code-aware, --target-ratio, "0.9", --intercept-tool-results]
    env: {HEADROOM_ROLLOUT_CHANNEL: canary}   # --intercept-tool-results 에 필요

  - name: headroom-r0.8
    kind: headroom
    args: [--mode, token, --code-aware, --target-ratio, "0.8", --intercept-tool-results]
    env: {HEADROOM_ROLLOUT_CHANNEL: canary}

  - name: headroom-r0.7
    kind: headroom
    args: [--mode, token, --code-aware, --target-ratio, "0.7", --intercept-tool-results]
    env: {HEADROOM_ROLLOUT_CHANNEL: canary}

  - name: headroom-r0.6
    kind: headroom
    args: [--mode, token, --code-aware, --target-ratio, "0.6", --intercept-tool-results]
    env: {HEADROOM_ROLLOUT_CHANNEL: canary}

  - name: headroom-r0.5
    kind: headroom
    args: [--mode, token, --code-aware, --target-ratio, "0.5", --intercept-tool-results]
    env: {HEADROOM_ROLLOUT_CHANNEL: canary}
