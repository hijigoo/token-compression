# 질문: 같은 압축률이면 어느 라이브러리가 정확도를 덜 잃는가?
#
# ratio 를 0.5 로 고정하고 라이브러리만 바꾼다. 변수를 하나로 묶어야
# "라이브러리 차이" 를 읽을 수 있다.
#
#   PUBLIC_HOST=benchmark-host python launch.py experiments/lib-compare.yaml
#
# ※ 압축률 정의가 라이브러리마다 미묘하게 다르다(토큰 기준 vs 문장 기준).
#    그래서 analyze.py 의 '절감(실측)' 열을 반드시 함께 봐야 한다.
#    실측 절감률이 서로 다르면 정확도만 비교하는 건 무의미하다.

name: lib-compare
benchmark: deep-swe
langs: [en, ko]        # 두 언어를 한 번에. 같은 태스크가 짝지어집니다
model: openai/gpt-5.5
agent: mini-swe-agent

dataset:
  # 쓸 태스크를 이름으로 적습니다. 지금은 한국어로 번역해 둔 것만
  # 올려 두었습니다. 비워 두시면(tasks: []) 공통인 것을 전부 씁니다.
  tasks:
    - aiomonitor-task-snapshots-diff
    - etree-xml-diff-patch
    - httpx-streaming-json-iteration
    - mashumaro-flattened-dataclass-fields
    - mnamer-daemon-watch-lifecycle
    - opa-rego-rule-profiling
    - updo-policy-alerting

n_attempts: 3
n_concurrent_trials: 4

arms:
  - name: baseline
    kind: direct

  - name: headroom-r0.5
    kind: headroom
    args: [--mode, token, --code-aware, --target-ratio, "0.5", --intercept-tool-results]
    env: {HEADROOM_ROLLOUT_CHANNEL: canary}

  # code-aware 를 끈 대조군 — AST 압축이 실제로 기여하는지 분리해서 본다
  - name: headroom-r0.5-nocode
    kind: headroom
    args: [--mode, token, --target-ratio, "0.5", --intercept-tool-results]
    env: {HEADROOM_ROLLOUT_CHANNEL: canary}

  - name: llmlingua-r0.5
    kind: local
    compressor: llmlingua
    ratio: 0.5

  - name: recomp-r0.5
    kind: local
    compressor: recomp
    ratio: 0.5
