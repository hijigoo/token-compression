# 압축 없음 — 기준선이자 하네스 점검
name: noop
lab: 00-baseline

params: {}                    # 조정할 것이 없습니다

dataset:
  path: ../../data/sample     # config 파일 기준 상대경로
  limit: null

# 토큰 인코딩 기준이자 실측에 쓸 배포명입니다.
model: gpt-5.4

tokenizer:
  mode: both            # both(기본) | api | local
                        #   both  — API 실측을 기준으로 쓰고 tiktoken 추정도 함께 잽니다
                        #   api   — 실측만. 자격증명이 없으면 실패합니다
                        #   local — tiktoken 만. 네트워크를 쓰지 않습니다
  cache: true           # 같은 텍스트는 한 번만 호출합니다
