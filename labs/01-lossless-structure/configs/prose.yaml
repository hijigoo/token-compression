# 같은 변환을 산문에 겁니다. 거의 0% 가 나오는 것이 정상이고,
# 그게 "무손실로 얻을 게 있는지는 입력이 정한다" 는 결론입니다.
name: prose
lab: 01-lossless-structure

dataset:
  path: ../../data/sample

model: gpt-5.4

params:
  pipeline:
    - json_to_table
    - json_compact
    - log_dedup
    - xml_compact
    - md_table_compact
    - kv_compact

tokenizer:
  mode: both            # both(기본) | api | local
                        #   both  — API 실측을 기준으로 쓰고 tiktoken 추정도 함께 잽니다
                        #   api   — 실측만. 자격증명이 없으면 실패합니다
                        #   local — tiktoken 만. 네트워크를 쓰지 않습니다
  cache: true           # 같은 텍스트는 한 번만 호출합니다
