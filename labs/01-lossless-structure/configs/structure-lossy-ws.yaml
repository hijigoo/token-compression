# 공백 접기까지 켭니다. 의미는 지키지만 **되돌릴 수 없습니다** —
# 원래 공백이 몇 칸이었는지 정보가 사라지기 때문입니다.
# 얼마를 더 얻고 무엇을 포기하는지 보려는 조건입니다.
name: structure-lossy-ws
lab: 01-lossless-structure

dataset:
  path: ../../data/sample-structured

model: gpt-5.4

params:
  pipeline:
    - json_to_table
    - json_compact
    - log_dedup
    - xml_compact
    - md_table_compact
    - kv_compact
    - ws_collapse       # ← 되돌리기 없음

tokenizer:
  mode: both            # both(기본) | api | local
                        #   both  — API 실측을 기준으로 쓰고 tiktoken 추정도 함께 잽니다
                        #   api   — 실측만. 자격증명이 없으면 실패합니다
                        #   local — tiktoken 만. 네트워크를 쓰지 않습니다
  cache: true           # 같은 텍스트는 한 번만 호출합니다
