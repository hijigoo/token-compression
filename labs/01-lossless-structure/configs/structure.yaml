# 구조화 텍스트에 무손실 변환을 겁니다. 이 랩의 기본 조건입니다.
name: structure
lab: 01-lossless-structure

dataset:
  path: ../../data/sample-structured

model: gpt-5.4

params:
  # 순서가 결과를 바꿉니다. json_to_table 이 성공하면 json_compact 는
  # 건너뜁니다 — 표로 편 쪽이 더 작기 때문입니다.
  pipeline:
    - json_to_table
    - json_compact
    - log_dedup
    - xml_compact
    - md_table_compact
    - kv_compact

tokenizer:
  mode: both            # both(기본) | api | local
                        #   both  — API 실측을 기준으로 쓰고 tiktoken 추정도 함께 잽니다
                        #   api   — 실측만. 자격증명이 없으면 실패합니다
                        #   local — tiktoken 만. 네트워크를 쓰지 않습니다
  cache: true           # 같은 텍스트는 한 번만 호출합니다
