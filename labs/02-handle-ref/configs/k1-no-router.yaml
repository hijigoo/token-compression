# 라우팅 없이 문서 **앞에서** k개만 펼칩니다. 가장 흔한 절단 방식입니다.
# k1.yaml 과 같은 조건인데 고르는 방법만 다릅니다 —
# 라우팅이 값을 하는지 보려면 이것과 나란히 놓아야 합니다.
name: k1-no-router
lab: 02-handle-ref

dataset:
  path: ../../data/sample-long

model: gpt-5.4

params:
  expand_k: 1
  route: first          # ← 라우팅 없음
  split: auto
  digest_chars: 24

tokenizer:
  mode: both            # both(기본) | api | local
                        #   both  — API 실측을 기준으로 쓰고 tiktoken 추정도 함께 잽니다
                        #   api   — 실측만. 자격증명이 없으면 실패합니다
                        #   local — tiktoken 만. 네트워크를 쓰지 않습니다
  cache: true           # 같은 텍스트는 한 번만 호출합니다
